[package]
name = "street-concept-designer-desktop"
version = "0.1.0"
description = "Street Concept Designer R3B desktop proof"
authors = ["Street Concept Designer"]
edition = "2021"
publish = false

[features]
default = []
native-benchmark = ["dep:street-concept-designer-bridge-common"]

[lib]
name = "street_concept_designer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
street-concept-designer-bridge-common = { path = "../bridge-common", optional = true }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
